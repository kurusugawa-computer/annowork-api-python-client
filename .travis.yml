dist: focal
language: python
jobs:
  include:
    - python: 3.12
      script:
        # 開発環境と同じPythonバージョンのときだけlintを実行する
        - make lint
    - python: 3.13
    - python: 3.14
    - python: 3.15

install:
  - pip install pip --upgrade
  - pip install uv==0.12.21
  - travis_retry uv sync --locked --no-default-groups --group linter --group test

before_script:
  - export TZ=Asia/Tokyo
  - sudo ln -sf /usr/share/zoneinfo/Asia/Tokyo /etc/localtime
  - echo "Asia/Tokyo" > sudo tee /etc/timezone  > /dev/null

script:
   - uv run --locked --no-default-groups --group test pytest tests/test_local_*.py

branches:
  only:
    - main
cache: pip
