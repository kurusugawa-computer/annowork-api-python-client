[project]
name = "annoworkapi"
dynamic = ["version"]
description = "Python Client Library of Annowork WebAPI"
authors = [{ name = "Kurusugawa Computer Inc." }]
requires-python = ">=3.12,<4"
license = "MIT"
keywords = ["annowork", "api"]
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["requests", "backoff"]

[project.urls]
Repository = "https://github.com/kurusugawa-computer/annowork-api-python-client"

[dependency-groups]
test = ["pytest>=9.1.1", "pytest-xdist>=3.8.0", "pytest-cov>=7.1.0", "more-itertools>=11.2.1"]
linter = [
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "types-requests>=2.33.0.20261006",
]
documentation = [
    "sphinx>=9.1.1", # Python 3.12で利用可能な最新版。3.13以降では9.2以降を利用する
    "pydata-sphinx-theme>=0.23.0",
]
dev = ["ipython>=9.17.1"]

[tool.uv]
required-version = ">=0.13.4"
default-groups = ["test", "linter", "documentation"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true


[tool.ruff]
target-version = "py312"
line-length = 150

[tool.ruff.lint]
ignore = [
    "CPY001", # 著作権表示はリポジトリのLICENSEで管理する
    "G004", # `logging-f-string` : loggingでf-stringを使いたいので無視する
    "RUF001", # 全角記号など`ambiguous unicode character`も使いたいため
    "RUF002",# 全角記号など`ambiguous unicode character`も使いたいため
    "RUF003",# 全角記号など`ambiguous unicode character`も使いたいため
    "PLC1901", # compare-to-empty-string : `if a == "`のように空文字列で直接比較したいときがあるため
    "PLR2004", # magic-value-comparison: listのサイズで判定するときがよくあるため
    "ANN002", # missing-type-args
    "ANN003", # missing-type-kwargs
    "ERA", # : 役立つこともあるが、コメントアウトしていないコードも警告されるので無視する
    "PERF203", # try-except-in-loop: ループ内でtry-exceptを使うこともあるため無視する。またPython3.11以降は無視できる
    "FIX", # TODOやFIXMEを使うため無視する
    "TD", # TODOコメントの書き方に気にしていないので無視する

    # いずれ無視しないようにする
    "ANN201", # missing-return-type-public-function:
    "ANN202", # missing-return-type-private-function:
    "PLR",  # pylint Refactor

    # 以下のルールはannofabcliのコードに合っていないので無効化した
    "RSE", # flake8-raise
    "D", # pydocstyle, Docstringを中途半端にしか書いていないので、除外する
    "C90", # mccabe
    "T20", # flake8-print
    "SLF", #  flake8-self
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "TRY", # tryceratops
    "COM", # flake8-commas
    "S", # flake8-bandit
    "EM",#flake8-errmsg
    "EXE", # flake8-executable
    "ICN", # flake8-import-conventions
    "RET",#flake8-return
    "SIM",#flake8-simplify
    "TC", # flake8-type-checking
    "PTH", #pathlibを使わないコードが多いので、除外する
    "ISC", #flake8-implicit-str-concat
    "N", # pep8-naming
    "PT", # flake8-pytest-style
]

select = [
    "ALL"
]

[tool.ruff.lint.per-file-ignores]
# テストコードはチェックを緩和する
"tests/**.py" = [
    "PGH",  # pygrep-hooks
    "DTZ",  # flake8-datetimez
    "ANN",  # flake8-annotations
    "E501",  # line-too-long
    "RUF100",  # unused-noqa
    "G004", # logging-f-string
    "SIM", #flake8-simplify
    "PLC2401", # non-ascii-name, メソッド名に日本語を利用するため
]


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10


[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"


[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
