name: Python tests and lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.21"
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Set timezone
        run: |
          export TZ=Asia/Tokyo
          sudo ln -sf /usr/share/zoneinfo/Asia/Tokyo /etc/localtime
          echo "Asia/Tokyo" > sudo tee /etc/timezone  > /dev/null
      - name: Test
        run: |
            uv run --locked --no-default-groups --group test pytest tests/test_local_*.py
          
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          version: "0.12.21"
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: |
            make lint
      
